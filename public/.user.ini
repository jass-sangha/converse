; Raised to cover the largest per-category attachment limit configured in
; config/chat.php (video: 100MB) — the PHP defaults (2M/8M) reject uploads
; before they ever reach the app's own, friendlier size-limit validation.
; Picked up automatically under PHP-FPM/CGI (Apache, Nginx+FPM). The
; built-in `php artisan serve` dev server does not read .user.ini files —
; see the CLI php.ini note in the project's file-sharing notes.
upload_max_filesize = 110M
post_max_size = 120M
